name: Build BashLock Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          cd BashLock_APK
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build_log.txt || true

      - name: Check Build Result
        run: |
          APK_COUNT=$(ls BashLock_APK/app/build/outputs/apk/debug/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Build failed, saving last 100 lines of log to git"
            tail -n 100 build_log.txt > build_error.txt
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add build_error.txt
            git commit -m "ci: record build error" || true
            git push origin main || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BashLock_App_Debug_APK
          path: BashLock_APK/app/build/outputs/apk/debug/*.apk
          retention-days: 14
